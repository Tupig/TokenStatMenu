name: TokenStatMenu CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tag, version, source commit and main ancestry
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 -B script/release_assets.py preflight --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      # One unsigned product: TokenStatMenu.app embeds TokenStatMenuWidget.appex. A failure here stops the job.
      - name: Unsigned Release app and embedded widget
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatMenu -configuration Release -derivedDataPath /tmp/TokenStatMenu-CI CODE_SIGNING_ALLOWED=NO build
      - name: Documentation links and synthetic checker fixtures
        run: python3 -B script/check_docs.py --self-test
      - name: Public content guardrail
        run: python3 -B script/check_public_content.py --git-index
      - name: Release contract and private native fixtures
        run: python3 -B script/test_release_assets.py
      - name: Local-only signing and anonymous download contracts
        run: PYTHONPATH=script python3 -B -m unittest test_verify_public_release test_release_dmg test_release_profiles
      - name: Explicit signing authorization and build entrypoint guards
        run: python3 -B script/test_sign_developer_id.py
      - name: Reject CI signing entrypoints before writes
        run: python3 -B script/test_build_entrypoint.py
      - name: Core and gateway discovery checks
        run: swift run --force-resolved-versions TokenStatCoreChecks
      - name: Compile UI test target and run OS-independent checks
        run: |
          swift test --force-resolved-versions --filter TokenStatUISnapshotTests.testCredentialAccountNamesAreURLAndPurposeBoundWithoutKeychainIO
          swift test --force-resolved-versions --filter TokenStatUISnapshotTests.testImageMatcherDetectsDeliberateMismatchWithoutRecording --skip-build
          swift test --force-resolved-versions --filter 'TokenHubQuotaStateTests.*testBP39' --skip-build
      - name: Run full test suite excluding renderer-dependent image snapshots
        run: |
          swift test --force-resolved-versions --skip-build \
            --skip TokenStatUISnapshotTests/testDashboardLightAndDark \
            --skip TokenStatUISnapshotTests/testSettingsLightAndDark \
            --skip TokenStatUISnapshotTests/testLocalStatusTitleUsesCompletedTurnAndRecordedSessionTotal \
            --skip TokenStatUISnapshotTests/testC12LocalAccountingUINeverLabelsPartialSubtotalAsComplete \
            --skip TokenStatUISnapshotTests/testC12AccountingDashboardExportsSyntheticReviewRenders \
            --skip TokenStatUISnapshotTests/testC11LocalQuotaSnapshotsNeverBecomeEnterpriseCurrentOrAlerts \
            --skip TokenStatUISnapshotTests/testC11QuotaCardRenderExportsLocalAndEnterpriseSyntheticExamples \
            --skip TokenStatUISnapshotTests/testHistoricalQuotaPresentationPreservesOriginalSourceValues \
            --skip TokenStatUISnapshotTests/testEnterpriseQuotaAlertsUseOnlyFreshIndependentWindows
      - name: Native development Widget product XCTest
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatDevWidgetLogicTests -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/TokenStatDevWidget-CI" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      # Development probe only. It is not the widget shipped inside TokenStatMenu.app.
      - name: Development widget probe build
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatMenuDevWidgetTest -configuration Debug -derivedDataPath "$RUNNER_TEMP/TokenStatDevWidget-CI" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Require unchanged committed dependency lock
        run: git diff --exit-code -- Package.resolved

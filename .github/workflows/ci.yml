name: TokenStatMenu CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tag, version, source commit and main ancestry
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 -B script/release_assets.py preflight --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Documentation links and synthetic checker fixtures
        run: python3 -B script/check_docs.py --self-test
      - name: Public content guardrail
        run: python3 -B script/check_public_content.py --git-index
      - name: Release contract and private native fixtures
        run: python3 -B script/test_release_assets.py
      - name: Core and gateway discovery checks
        run: swift run --force-resolved-versions TokenStatCoreChecks
      - name: Compile UI test target and run OS-independent checks
        run: |
          swift test --force-resolved-versions --filter TokenStatUISnapshotTests.testCredentialAccountNamesAreURLAndPurposeBoundWithoutKeychainIO
          swift test --force-resolved-versions --filter TokenStatUISnapshotTests.testImageMatcherDetectsDeliberateMismatchWithoutRecording
          swift test --force-resolved-versions --filter 'TokenHubQuotaStateTests.*testBP39'
      - name: Run full test suite excluding renderer-dependent image snapshots
        run: |
          swift test --force-resolved-versions \
            --skip TokenStatUISnapshotTests/testDashboardLightAndDark \
            --skip TokenStatUISnapshotTests/testSettingsLightAndDark \
            --skip TokenStatUISnapshotTests/testLocalStatusTitleUsesCompletedTurnAndRecordedSessionTotal \
            --skip TokenStatUISnapshotTests/testC12LocalAccountingUINeverLabelsPartialSubtotalAsComplete \
            --skip TokenStatUISnapshotTests/testC12AccountingDashboardExportsSyntheticReviewRenders \
            --skip TokenStatUISnapshotTests/testC11LocalQuotaSnapshotsNeverBecomeEnterpriseCurrentOrAlerts \
            --skip TokenStatUISnapshotTests/testC11QuotaCardRenderExportsLocalAndEnterpriseSyntheticExamples \
            --skip TokenStatUISnapshotTests/testHistoricalQuotaPresentationPreservesOriginalSourceValues \
            --skip TokenStatUISnapshotTests/testEnterpriseQuotaAlertsUseOnlyFreshIndependentWindows
      - name: Native Xcode build
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatMenu -configuration Release -derivedDataPath /tmp/TokenStatMenu-CI CODE_SIGNING_ALLOWED=NO build
      - name: Native development Widget product XCTest
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatDevWidgetLogicTests -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/TokenStatDevWidgetLogicTests" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Native development Widget host and extension build
        run: xcodebuild -project TokenStatMenu.xcodeproj -scheme TokenStatMenuDevWidgetTest -configuration Debug -derivedDataPath "$RUNNER_TEMP/TokenStatDevWidgetBuild" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Require unchanged committed dependency lock
        run: git diff --exit-code -- Package.resolved
      - name: Build and ad hoc sign Universal app without launching
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          # A real App Group is repository configuration, never source. A
          # missing value fails the build instead of shipping a placeholder.
          TOKENSTAT_WIDGET_GROUP: ${{ vars.TOKENSTAT_WIDGET_GROUP }}
        run: ./script/build_and_run.sh --arm64
      - name: Package reviewed source archive
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 -B script/package_source.py
          git diff --exit-code
      - name: Package exactly five assets with native checks
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: python3 -B script/release_assets.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --app dist/TokenStatMenu.app --source dist/TokenStatMenu-source.zip --directory dist/release
      - name: Verify asset identities, payloads and checksums
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: python3 -B script/release_assets.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: tokenstatmenu-release
          if-no-files-found: error
          path: |
            dist/release/TokenStatMenu.zip
            dist/release/TokenStatMenu-source.zip
            dist/release/TokenStatMenu.dmg
            dist/release/release-manifest.json
            dist/release/SHA256SUMS
  publish:
    runs-on: macos-15
    needs: build
    if: ${{ vars.TOKENSTAT_CLOUD_RELEASE == 'enabled' && github.repository == 'Tupig/TokenStatMenu' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: tokenstatmenu-release
          path: dist/release
      - name: Verify downloaded assets against this source before writes
        run: python3 -B script/release_assets.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory dist/release
      - name: Resume matching draft, verify remote bytes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B script/release_assets.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory dist/release
